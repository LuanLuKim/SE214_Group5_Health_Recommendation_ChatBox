services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: health_dev
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: health_assistant
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U health_dev -d health_assistant']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
