# Cấu hình mặc định: DATA_MODE=mock, không cần PostgreSQL.
# Giá trị lấy từ biến môi trường hoặc file backend/.env (KEY=VALUE, Git bỏ qua).
spring:
  application:
    name: health-assistant-backend
  config:
    import: optional:file:./.env[.properties]
  profiles:
    active: ${DATA_MODE:mock}
  # Chế độ mock không có cơ sở dữ liệu: tắt tự cấu hình DataSource và Flyway.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false
  web:
    resources:
      add-mappings: false
  main:
    banner-mode: off
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

server:
  address: ${HOST:127.0.0.1}
  port: ${PORT:4000}
  # Sau reverse proxy đặt FORWARD_HEADERS=native: IP người dùng lấy từ X-Forwarded-For (chỉ tin proxy
  # ở dải địa chỉ nội bộ), nếu không giới hạn tần suất sẽ tính chung mọi người vào IP của proxy.
  forward-headers-strategy: ${FORWARD_HEADERS:none}
  error:
    whitelabel:
      enabled: false
  servlet:
    encoding:
      charset: UTF-8
      force: true

app:
  data-mode: ${DATA_MODE:mock}
  web-origin: ${WEB_ORIGIN:http://localhost:5173}
  max-body-bytes: 32768
  rate-limit-per-minute: 120
  accounts:
    terms-version: ${TERMS_VERSION:v1}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    facebook-app-id: ${FACEBOOK_APP_ID:}
    facebook-app-secret: ${FACEBOOK_APP_SECRET:}
    email-otp:
      hash-secret: ${EMAIL_OTP_HASH_SECRET:}
      from-address: ${MAIL_FROM:}
    auth-token:
      secret: ${AUTH_TOKEN_SECRET:}
  # Chạy dữ liệu tổng hợp trong database/seeds sau migration (chỉ máy phát triển).
  seed-synthetic: ${SEED_SYNTHETIC:false}
  database-dir: ${DATABASE_DIR:../database}
  # Dịch vụ Python. Chỉ Spring Boot gọi tới, kèm khóa dịch vụ.
  ai-service:
    base-url: ${AI_SERVICE_URL:http://127.0.0.1:8001}
    key: ${AI_SERVICE_KEY:}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:20000}
  stats-service:
    base-url: ${STATS_SERVICE_URL:http://127.0.0.1:8002}
    key: ${STATS_SERVICE_KEY:}
    timeout-ms: ${STATS_SERVICE_TIMEOUT_MS:10000}

logging:
  level:
    root: INFO
