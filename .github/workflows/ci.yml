name: CI
on:
  pull_request:
    branches: [main]
  # Mọi nhánh được đẩy lên đều chạy check; nhánh fail sẽ hiện dấu đỏ và không merge được vào main.
  push:
    branches: ['**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Tên job "check" là tên ngữ cảnh bắt buộc trong ruleset của nhánh main.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Frontend và contracts: typecheck, test giao diện, build.
      - run: npm run check

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Spring Boot: biên dịch, test API, test PostgreSQL nhúng (Flyway + seed), đóng gói jar.
      - run: mvn -B -f backend/pom.xml verify

  services:
    name: services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/*/requirements.txt
      - run: python -m pip install -r services/ai/requirements.txt -r services/stats/requirements.txt
      - name: FastAPI (services/ai)
        working-directory: services/ai
        run: python -m pytest
      - name: Django (services/stats)
        working-directory: services/stats
        run: python manage.py test

  data-tools:
    name: data-tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/crawl/requirements.txt
      - run: python -m pip install -r tools/crawl/requirements.txt
      - run: python -B -m unittest discover -s tools/crawl -p "test_*.py"
      - run: python -B tools/normalize/test_normalize.py

  # SCRUM-45: kiểm thử hạ tầng. PostgreSQL thật, migration + seed chạy khi backend khởi động,
  # ba service trả /healthz, backend đọc được dữ liệu đã seed.
  infra-smoke:
    name: infra-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: health_dev
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: health_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health_dev -d health_assistant"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATA_MODE: postgres
      SEED_SYNTHETIC: 'true'
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/health_assistant
      DATABASE_USER: health_dev
      DATABASE_PASSWORD: local_dev_only
      DATABASE_DIR: ${{ github.workspace }}/database
      AI_SERVICE_KEY: ci-smoke-key
      STATS_SERVICE_KEY: ci-smoke-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/*/requirements.txt
      - run: mvn -B -q -f backend/pom.xml -DskipTests package
      - run: python -m pip install -r services/ai/requirements.txt -r services/stats/requirements.txt
      - name: Khởi động ba service
        run: |
          java -jar backend/target/health-assistant-backend-0.1.0.jar > backend.log 2>&1 &
          (cd services/ai && python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > ../../ai.log 2>&1 &)
          (cd services/stats && python manage.py runserver 127.0.0.1:8002 --noreload > ../../stats.log 2>&1 &)
      - name: Chờ /healthz
        run: |
          for url in http://127.0.0.1:4000/healthz http://127.0.0.1:8001/healthz http://127.0.0.1:8002/healthz; do
            for i in $(seq 1 60); do curl -fs "$url" > /dev/null && break; sleep 2; done
            curl -fs "$url" | jq -e '.data.status == "ok"'
          done
      - name: Backend đọc PostgreSQL đã migrate và seed
        run: |
          curl -fs http://127.0.0.1:4000/api/v1/knowledge/articles \
            | jq -e '.meta.status == "DATABASE_RESULTS" and (.data | length) == 1'
          curl -s http://127.0.0.1:4000/api/v1/accounts/me | jq -e '.error.code == "AUTH_NOT_CONFIGURED"'
      - name: Service Python từ chối lời gọi không có khóa
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8001/v1/safety/evaluate -H 'Content-Type: application/json' -d '{"text":"ci"}')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8002/v1/system/statistics)" = 401
      - name: Log khi lỗi
        if: failure()
        run: tail -n 80 backend.log ai.log stats.log || true

  # Dựng cả stack bằng Docker Compose như trên máy demo: build ba image, chờ healthcheck của từng
  # container, gọi API qua backend và gọi hai service Python từ trong mạng compose.
  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cấu hình compose hợp lệ (máy phát triển và bản triển khai)
        env:
          DATABASE_PASSWORD: ci-only
          WEB_ORIGIN: https://ci.invalid
          AI_SERVICE_KEY: ci-only
          STATS_SERVICE_KEY: ci-only
          DJANGO_SECRET_KEY: ci-only
        run: |
          docker compose --profile full config --quiet
          docker compose -f deploy/compose.yaml --env-file deploy/.env.example config --quiet
      - name: Thiếu bí mật thì bản triển khai không khởi động
        run: |
          if docker compose -f deploy/compose.yaml --env-file deploy/.env.example config --quiet 2> missing.log; then
            echo "deploy/compose.yaml chấp nhận file .env chưa điền bí mật"; exit 1
          fi
          grep -q "DATABASE_PASSWORD" missing.log
      - name: Dựng stack và chờ healthy
        run: docker compose --profile full up --build --detach --wait --wait-timeout 420
      - name: Gọi API qua backend
        run: |
          curl -fsS http://127.0.0.1:4000/healthz | jq -e '.data.status == "ok"'
          articles=$(curl -fsS http://127.0.0.1:4000/api/v1/knowledge/articles)
          echo "$articles" | jq -e '.meta.status == "DATABASE_RESULTS" and (.data | length) == 1'
      - name: Backend gọi được hai service Python trong mạng compose
        env:
          IN_BACKEND: docker compose --profile full exec -T backend
          KEY: 'X-Service-Key: local_dev_only_key'
        run: |
          decision=$($IN_BACKEND curl -fsS -X POST http://ai:8001/v1/safety/evaluate -H "$KEY" -H 'Content-Type: application/json' -d '{"text":"ci"}')
          echo "$decision" | jq -e '.data.status == "UNAVAILABLE"'
          code=$($IN_BACKEND curl -s -o /dev/null -w '%{http_code}' -H "$KEY" http://stats:8002/v1/system/statistics)
          test "$code" = 501
      - name: Service Python không mở cổng ra máy chủ
        run: |
          for port in 8001 8002; do
            if curl -s -m 3 -o /dev/null "http://127.0.0.1:$port/healthz"; then
              echo "Cổng $port đang mở ra ngoài mạng compose"; exit 1
            fi
          done
      # Từ đây chạy deploy/compose.yaml đúng các bước trong docs/DEPLOY.md. Image vừa build được gắn
      # tên ghcr.io với tag "ci" để không phải kéo từ registry (PR chưa đẩy image).
      - name: Gắn tag image vừa build cho bản triển khai
        run: |
          for name in backend ai stats; do
            image=$(docker inspect --format '{{.Image}}' "$(docker compose --profile full ps -q "$name")")
            docker tag "$image" "ghcr.io/luanlukim/se214-health-$name:ci"
          done
          docker compose --profile full down --volumes
      - name: Bản triển khai khởi động theo docs/DEPLOY.md
        run: |
          cp deploy/.env.example deploy/.env
          fill() { grep -q "^$1=" deploy/.env && sed -i "s|^$1=.*|$1=$2|" deploy/.env; }
          fill IMAGE_TAG ci
          fill DATABASE_PASSWORD "$(openssl rand -hex 16)"
          fill WEB_ORIGIN https://ci.invalid
          fill AI_SERVICE_KEY "$(openssl rand -hex 16)"
          fill STATS_SERVICE_KEY "$(openssl rand -hex 16)"
          fill DJANGO_SECRET_KEY "$(openssl rand -hex 16)"
          fill APP_ENV demo
          fill SEED_SYNTHETIC true
          docker compose -f deploy/compose.yaml up --detach --wait --wait-timeout 300 --pull never
      - name: Bản triển khai trả dữ liệu, khóa dịch vụ khớp hai phía, chỉ backend mở cổng
        env:
          DEPLOY: docker compose -f deploy/compose.yaml
        run: |
          curl -fsS http://127.0.0.1:4000/healthz | jq -e '.data.status == "ok"'
          curl -fsS http://127.0.0.1:4000/api/v1/knowledge/articles \
            | jq -e '.meta.status == "DATABASE_RESULTS" and (.data | length) == 1'
          $DEPLOY exec -T backend sh -c 'curl -fsS -X POST http://ai:8001/v1/safety/evaluate \
            -H "X-Service-Key: $AI_SERVICE_KEY" -H "Content-Type: application/json" -d "{\"text\":\"ci\"}"' \
            | jq -e '.data.status == "UNAVAILABLE"'
          code=$($DEPLOY exec -T backend sh -c 'curl -s -o /dev/null -w "%{http_code}" \
            -H "X-Service-Key: $STATS_SERVICE_KEY" http://stats:8002/v1/system/statistics')
          test "$code" = 501
          for name in db ai stats; do
            published=$(docker port "$($DEPLOY ps -q "$name")")
            if [ -n "$published" ]; then
              echo "Container $name mở cổng ra máy chủ: $published"; exit 1
            fi
          done
      - name: Trạng thái và log khi lỗi
        if: failure()
        run: |
          docker compose --profile full ps
          docker compose --profile full logs --tail 80
          if [ -f deploy/.env ]; then
            docker compose -f deploy/compose.yaml ps
            docker compose -f deploy/compose.yaml logs --tail 80
          fi
      - name: Dọn dẹp
        if: always()
        run: |
          docker compose --profile full down --volumes
          if [ -f deploy/.env ]; then docker compose -f deploy/compose.yaml down --volumes; fi
