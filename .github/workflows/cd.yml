name: CD
# Đóng gói để triển khai: build image Docker cho backend, dịch vụ AI, dịch vụ thống kê và bản build web.
# PR vào main: chỉ build để kiểm tra Dockerfile. Merge vào main: build và đẩy image lên GitHub Container Registry.
on:
  pull_request:
    branches: [main]
    paths:
      [
        'backend/**',
        'services/**',
        'database/**',
        'apps/web/**',
        'packages/**',
        '.github/workflows/cd.yml',
      ]
  push:
    branches: [main]
    paths:
      [
        'backend/**',
        'services/**',
        'database/**',
        'apps/web/**',
        'packages/**',
        '.github/workflows/cd.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  images:
    name: image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
          - name: ai
            dockerfile: services/ai/Dockerfile
          - name: stats
            dockerfile: services/stats/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Tên image (GHCR yêu cầu chữ thường)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/se214-health-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  web:
    name: web-dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          retention-days: 14
